- num_row: 1
  speakers:
    - name: Alasdair Newson
      title: Dr.
      affiliation: Sorbonne University, France
      photo: alasdair-newson.jpg
      url: https://sites.google.com/site/alasdairnewson
      bio: "Alasdair Newson is a lecturer (associate professor) at the ISIR (Institut des Systèmes Intelligents et de Robotique) of Sorbonne Université (France), since 2023. He received his PhD from Télécom Paris (France) in 2014. From 2018 to 2023, he was assistant professor at Télécom Paris. His research interests include image and video restoration, editing and analysis, and the study of generative models for these purposes."
- num_row: 2
  speakers:
    - name: Luiz Velho
      title: Dr.
      affiliation: Institute for Pure and Applied Mathematics (IMPA), Brazil
      photo: luiz-velho.jpg
      url: https://lvelho.impa.br
      bio: "Luiz Velho is a Scientist and a Creative Leader in Media Arts and Technologies. A pioneer in Computer Graphics, in 1978 he created the first computer-animated film in Brazil. He holds a PhD from the University of Toronto, an MSc from the MIT Media Lab, and a BA from ESDI. He is a senior researcher at IMPA and the head of the VISGRAF Laboratory. He has been a visiting researcher at the National Film Board, the Courant Institute of Mathematical Sciences, HP Imaging Research Lab, and Microsoft Research Asia. Among his many distinctions are the National Order of Scientific Merit; the Compaq Award for Computer Science; more than 33 award-winning technical papers; and 11 best video awards."